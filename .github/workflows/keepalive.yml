name: Keepalive

# 保活：GitHub 會把「連續 60 天沒有 commit」的 repo 內排程 workflow 自动停用。
# 這個 job 每 ~10 天檢查一次，只有在距上次 commit >= 40 天時才補一個空 commit，
# 重置 60 天計時器，讓每 6 小時的自動簽到持續運作。commit 帶 [skip ci] 不觸發其他流程。

on:
  schedule:
    - cron: '37 4 */10 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push empty commit when repo idle >= 40 days
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Days since last commit: $DAYS"
          if [ "$DAYS" -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive to keep scheduled check-in alive [skip ci]"
            git push origin HEAD:main
            echo "Pushed keepalive commit."
          else
            echo "Repo recently active; no keepalive commit needed."
          fi
